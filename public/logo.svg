<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64">
  <defs>
    <linearGradient id="ssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblem: planet core with orbital ring + station node -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="13" fill="url(#coreGrad)"/>
    <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="url(#ssGrad)" stroke-width="2.2"
             transform="rotate(-22 32 32)"/>
    <!-- station node on the ring -->
    <g transform="rotate(-22 32 32)">
      <circle cx="56" cy="32" r="3.4" fill="#e0f2fe"/>
      <rect x="50.8" y="31.2" width="3.4" height="1.6" rx="0.8" fill="#7dd3fc"/>
      <rect x="57.8" y="31.2" width="3.4" height="1.6" rx="0.8" fill="#7dd3fc"/>
    </g>
    <!-- small stars -->
    <circle cx="12" cy="14" r="1.1" fill="#e0f2fe"/>
    <circle cx="52" cy="10" r="0.9" fill="#c7d2fe"/>
    <circle cx="10" cy="50" r="0.8" fill="#c7d2fe"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="36" font-family="Avenir Next, Futura, 'Segoe UI', Helvetica, sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.5" fill="url(#ssGrad)">SPACESTATION</text>
  <text x="66" y="52" font-family="Avenir Next, Futura, 'Segoe UI', Helvetica, sans-serif"
        font-size="10" font-weight="400" letter-spacing="4.2" fill="#94a3b8">.SI &#183; ORBITAL LEARNING</text>
</svg>
